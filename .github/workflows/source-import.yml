name: Import original Organix C++ sources
on:
  push:
    paths: ['.github/workflows/source-import.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundle and restore exact original source files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, lzma, pathlib, zlib
          parts = sorted(pathlib.Path('.bootstrap').glob('payload-*.txt'))
          assert len(parts) == 7
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          assert len(encoded) == 24024
          assert zlib.crc32(encoded.encode('ascii')) == 0x9426f05c
          data = json.loads(lzma.decompress(base64.b64decode(encoded)).decode('utf-8'))
          assert len(data) == 14
          for name, source in data.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(source, encoding='utf-8')
              print('Restored', name)
          PY
      - name: Commit restored C++ sources and project CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CMakeLists.txt Source Tests docs
          if ! git diff --cached --quiet; then
            git commit -m 'Import original Organix v0.1 JUCE source project'
            git push origin HEAD:main
          fi
      - name: Cancel initial waiting macOS bootstrap run
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST /repos/${{ github.repository }}/actions/runs/43862565001/cancel || true
