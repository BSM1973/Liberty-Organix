name: Organix BUILD AU/VST3 — ARTIFACT OBLIGATOIRE
on:
  push:
    branches: [main, feature/ui-v0.3-precision]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'tools/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: organix-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-arm64:
    name: macOS AU + VST3 + ARTIFACT RÉEL VÉRIFIÉ
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native Apple Silicon
        shell: bash
        run: |
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"
      - name: Validate UI UTF-8 and missing-glyph policy
        run: python3 tools/check_ui_text.py
      - name: Determine release version
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re
          source = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"project\(Organix VERSION ([0-9]+\.[0-9]+\.[0-9]+)", source)
          if not match:
              raise SystemExit("Missing Organix VERSION in CMakeLists.txt")
          print("number=" + match.group(1))
          PY
      - name: Configure JUCE 8 / CMake for ARM64
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release
      - name: Build Audio Unit, VST3, Standalone and DSP tests
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP and factory preset tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render and measure all 100 factory DSP preview sounds
        shell: bash
        run: |
          set -euo pipefail
          test -x build/Tests/Release/organix_factory_audio_audit
          build/Tests/Release/organix_factory_audio_audit --render factory-audition
          test "$(find factory-audition -name '*.wav' | wc -l | tr -d ' ')" = "100"
          test -s factory-audition/factory_preset_audio_qa.csv
      - name: Export full 100-preset feature and parameter manifest
        shell: bash
        run: |
          set -euo pipefail
          test -x build/Tests/Release/organix_factory_sound_designs
          build/Tests/Release/organix_factory_sound_designs --export factory-audition/factory_sound_design_manifest.csv
          test "$(wc -l < factory-audition/factory_sound_design_manifest.csv | tr -d ' ')" = "101"
      - name: Verify AU and VST3 are native ARM64 and package them
        shell: bash
        run: |
          set -euo pipefail
          AU="build/Organix_artefacts/Release/AU/Organix.component"
          VST3="build/Organix_artefacts/Release/VST3/Organix.vst3"
          test -f "$AU/Contents/MacOS/Organix"
          test -f "$VST3/Contents/MacOS/Organix"
          file "$AU/Contents/MacOS/Organix" "$VST3/Contents/MacOS/Organix"
          lipo -archs "$AU/Contents/MacOS/Organix" | grep -qw arm64
          lipo -archs "$VST3/Contents/MacOS/Organix" | grep -qw arm64
          ditto -c -k --keepParent "$AU" Organix-AU-macOS-arm64.zip
          ditto -c -k --keepParent "$VST3" Organix-VST3-macOS-arm64.zip
      - name: RELEASE GATE 1 — Verify both local AU/VST3 archives
        run: python3 tools/verify_downloadable_artifact.py local
      - name: Publish mandatory AU/VST3 downloads
        id: published
        uses: actions/upload-artifact@v4
        with:
          name: Organix-v${{ steps.version.outputs.number }}-macOS-arm64-AU-VST3
          path: |
            Organix-AU-macOS-arm64.zip
            Organix-VST3-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: RELEASE GATE 2 — Download the actual published Artifact via GitHub Actions
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.published.outputs.artifact-id }}
          path: verified-download
          merge-multiple: true
      - name: RELEASE GATE 3 — Verify downloaded Artifact includes working AU and VST3 ZIPs
        env:
          ARTIFACT_ID: ${{ steps.published.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: Organix-v${{ steps.version.outputs.number }}-macOS-arm64-AU-VST3
          DOWNLOADED_ARTIFACT_DIR: verified-download
        run: python3 tools/verify_downloadable_artifact.py published

      - name: Publish 100 synthetic source factory sound previews and measured QA CSV
        uses: actions/upload-artifact@v4
        with:
          name: Organix-100-Factory-Audition-and-QA-v${{ steps.version.outputs.number }}
          path: |
            factory-audition/*.wav
            factory-audition/factory_preset_audio_qa.csv
            factory-audition/factory_sound_design_manifest.csv
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
