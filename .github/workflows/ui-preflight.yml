name: Organix DSP and UI Geometry — Fast Preflight
on:
  push:
    branches: [main, feature/ui-v0.3-precision]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ui-preflight.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ui-preflight.yml'
  workflow_dispatch:

concurrency:
  group: organix-ui-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-and-layout:
    name: C++ DSP / 756-window UI geometry regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate UI UTF-8 and missing-glyph policy
        run: python3 tools/check_ui_text.py
      - name: Configure pure C++ tests, no JUCE download needed
        run: cmake -S . -B build-test -DORGANIX_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile smoke, preset, material and UI geometry tests
        run: cmake --build build-test --parallel 2
      - name: Execute all tests with failures visible
        run: ctest --test-dir build-test --output-on-failure
